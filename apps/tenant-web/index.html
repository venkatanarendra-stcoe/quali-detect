<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23111827%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27sans-serif%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23ffffff%27%3EQ%3C/text%3E%3C/svg%3E"
    />
    <title>QmentisAI</title>
    <script>
      // Apply the last known accent before first paint (cache written by the app; unknown or missing = mint).
      try {
        var accent = localStorage.getItem("qm-accent");
        document.documentElement.setAttribute(
          "data-accent",
          /^(mint|violet|blue|cyan|teal|emerald|amber|orange|rose)$/.test(accent) ? accent : "mint",
        );
      } catch (e) {
        document.documentElement.setAttribute("data-accent", "mint");
      }
      // Apply the saved theme before first paint (no flash). Storage may be unavailable: fall back to the system theme.
      try {
        var saved = JSON.parse(localStorage.getItem("qm-ui") || "{}").state || {};
        var dark =
          saved.theme === "dark" ||
          ((!saved.theme || saved.theme === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.toggle(
          "dark",
          matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
