# Platform-owned OSV-Scanner configuration for the SCA role (SPEC scan-engines 11.3, Part G). The run passes it with `--config /rules/osv-scanner.toml` and `--no-ignore`, so an `osv-scanner.toml` inside the scanned repository is never read (verified by a real run on 2026-11-21: a planted file ignoring a vulnerability and a package changed nothing). Deliberately empty: every setting of the tool is a flag of the sealed command line.
